name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # UTC 07:30 = Beijing 15:30, Monday through Friday. GitHub may queue it later.
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free market-data dependency
        run: pip install -r requirements.txt
      - name: Update prices without destroying prior valid data
        run: python scripts/update_market.py
      - name: Commit only when market data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "chore: update market data"
          git push

